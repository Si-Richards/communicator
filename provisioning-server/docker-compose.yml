services:
  provisioning:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - provisioning-data:/data

  provisioning-admin:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    command: ["uvicorn", "app.main:admin_app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - provisioning-data:/data


  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      - provisioning
      - provisioning-admin
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/letsencrypt:/etc/letsencrypt:ro

  certbot:
    image: certbot/certbot:latest
    profiles: ["tools"]
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/letsencrypt:/etc/letsencrypt


volumes:
  provisioning-data:
