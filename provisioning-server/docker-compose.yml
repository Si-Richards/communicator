services:
  provisioning:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - provisioning-data:/data
    networks:
      - default
      - mobile-gateway-shared

  provisioning-admin:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    command: ["uvicorn", "app.main:admin_app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - provisioning-data:/data
    networks:
      - default
      - mobile-gateway-shared

  messaging-worker:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    command: ["python", "-m", "app.messaging_worker"]
    volumes:
      - provisioning-data:/data
    networks:
      - default
      - mobile-gateway-shared

  messaging-notifications:
    profiles: ["messaging-push"]
    build: .
    restart: unless-stopped
    env_file:
      - .env
    command: ["python", "-m", "app.messaging_notifications"]
    volumes:
      - provisioning-data:/data
      - ./secrets/messaging-apns.p8:/run/secrets/messaging-apns.p8:ro
    networks:
      - default


volumes:
  provisioning-data:

networks:
  mobile-gateway-shared:
    external: true
    name: mobile-gateway_default
