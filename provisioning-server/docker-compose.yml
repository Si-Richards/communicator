services:
  provisioning:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - provisioning-data:/data

  provisioning-admin:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    command: ["uvicorn", "app.main:admin_app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - provisioning-data:/data

volumes:
  provisioning-data:
