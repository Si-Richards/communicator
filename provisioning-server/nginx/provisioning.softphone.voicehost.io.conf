# Install as an NGINX site on the provisioning host. Replace the certificate
# paths with the actual certificate files, then nginx -t before reloading.
# Provide /etc/nginx/snippets/softphone-provisioning-admin-allowlist.conf with:
#   allow <VPN_OR_MANAGEMENT_CIDR>;
#   deny all;
# Never add a blanket allow directive or publish admin port 8082.
#
# If a CDN or upstream load balancer terminates TLS, carefully configure
# trusted real_ip sources before depending on remote_addr allowlists.

server {
    listen 443 ssl;
    server_name provisioning.softphone.voicehost.io;
    ssl_certificate /etc/letsencrypt/live/provisioning.softphone.voicehost.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/provisioning.softphone.voicehost.io/privkey.pem;

    client_max_body_size 128k;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 8443 ssl;
    server_name provisioning.softphone.voicehost.io;
    ssl_certificate /etc/letsencrypt/live/provisioning.softphone.voicehost.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/provisioning.softphone.voicehost.io/privkey.pem;

    # Applied at the server level to ALL routes, including /docs and /openapi.json.
    include /etc/nginx/snippets/softphone-provisioning-admin-allowlist.conf;
    client_max_body_size 128k;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
