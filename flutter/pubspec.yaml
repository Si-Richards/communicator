name: voicehost_softphone
description: VoiceHost cross-platform Janus WebRTC softphone for iOS and Android.
publish_to: "none"
version: 0.3.0+37

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_webrtc: 1.6.2+hotfix.3
  flutter_callkit_incoming: 3.1.5
  web_socket_channel: 3.0.3
  shared_preferences: 2.5.5
  flutter_secure_storage: 11.1.1
  http: ^1.5.0
  dartdap: ^0.11.4
  xml: ^6.6.1
  cryptography: ^2.9.0
  crypto: ^3.0.6
  path_provider: ^2.1.5
  image_picker: 1.2.0
  file_picker: 13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
